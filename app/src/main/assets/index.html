<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080f1a"><title>TVault 27</title>
<style>
:root{--bg:#080f1a;--surface:#101b2a;--surface2:#142235;--surface3:#1a2b40;--line:#263a50;--ink:#edf4fb;--muted:#91a4ba;--teal:#45d6b0;--teal2:#1caa8c;--red:#ff7187;--gold:#e8bd70;--blue:#7db8ed;--r:17px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#17354a 0,transparent 38%),var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:18px 18px 96px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#6ce3c4,#148c7c);display:grid;place-items:center;color:#06251f;font-weight:950;font-size:21px;box-shadow:0 8px 28px #31c9a433}.brand h1{font-size:17px;margin:0;letter-spacing:.5px}.brand small{color:#8ba3b9;letter-spacing:2px;text-transform:uppercase;font-size:9px}.headright{display:flex;gap:8px;align-items:center}.select,.btn,.input,select,textarea{border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:10px 12px}.select{max-width:145px}.btn{font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:linear-gradient(135deg,#52dfb8,#20a98d);border:0;color:#05241d}.btn.ghost{background:var(--surface2)}.btn.sm{font-size:12px;padding:7px 10px}.nav{display:flex;gap:6px;padding:6px;background:#0d1725;border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:auto}.nav button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px;font-weight:650}.nav button.active{background:#203449;color:var(--ink)}.nav button.active span{color:var(--teal)}.eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--teal);font-weight:800}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 17px}.pagehead h2{font-size:26px;letter-spacing:-.8px;margin:3px 0}.pagehead p{margin:0;color:var(--muted)}.grid{display:grid;gap:13px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{background:linear-gradient(155deg,#132134,#0f1927);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}.metriclabel{color:var(--muted);font-size:11px}.metric{font-size:25px;font-weight:800;letter-spacing:-.8px;margin:7px 0 2px}.sub{font-size:11px;color:var(--muted)}.green{color:var(--teal)!important}.red{color:var(--red)!important}.gold{color:var(--gold)!important}.two{grid-template-columns:1.4fr 1fr}.cardtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:750;margin-bottom:13px}.cardtitle small{color:var(--muted);font-weight:500}.chart{width:100%;height:190px;display:block}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.tbl{width:100%;border-collapse:collapse;min-width:660px}.tbl th,.tbl td{padding:11px 12px;border-bottom:1px solid #213247;text-align:left;white-space:nowrap}.tbl th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;background:#132033}.tbl tr:last-child td{border:0}.badge{display:inline-block;padding:4px 8px;border-radius:30px;font-size:10px;font-weight:800;background:#20344a;color:#bdd2e5}.badge.win{background:#103d33;color:#76e4c0}.badge.loss{background:#421f2d;color:#ff9aad}.badge.be{background:#293448;color:#c0cfe0}.empty{border:1px dashed #3a5068;border-radius:13px;padding:25px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:4px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#a9bbcc;font-weight:750}.field input,.field select,.field textarea{width:100%;min-width:0;outline:none}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #45d6b018}.span3{grid-column:1/-1}.section{font-size:10px;color:var(--teal);font-weight:850;letter-spacing:1.5px;text-transform:uppercase;margin:19px 0 10px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.checks label{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid var(--line);background:#142337;border-radius:10px;font-size:11px}.checks input{accent-color:var(--teal)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{padding:8px 10px}.bars{display:grid;gap:12px}.bar{display:grid;grid-template-columns:100px 1fr 48px;align-items:center;gap:9px;font-size:11px}.track{height:8px;border-radius:10px;background:#24354a;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#159c83,#58dcb8);border-radius:10px}.muted{color:var(--muted)}.note{padding:13px;border:1px solid var(--line);border-radius:12px;background:#111e2e;margin-top:10px}.note h4{margin:0 0 4px}.note p{margin:0;color:var(--muted);white-space:pre-wrap}.modal{position:fixed;inset:0;background:#020711c9;display:none;align-items:center;justify-content:center;padding:15px;z-index:8}.modal.show{display:flex}.modalbox{width:min(650px,100%);max-height:88vh;overflow:auto;background:#101c2c;border:1px solid #3b526d;border-radius:18px;padding:18px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#dcfff3;color:#064333;padding:11px 15px;border-radius:10px;font-weight:800;display:none;z-index:10}.toast.show{display:block}.foot{margin-top:20px;color:#637b91;font-size:10px;text-align:center}.mobilebar{display:none}
@media(max-width:760px){.shell{padding:13px 12px 95px}.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.checks{grid-template-columns:repeat(2,1fr)}.nav{display:none}.mobilebar{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:#0b1523f5;border-top:1px solid var(--line);justify-content:space-around}.mobilebar button{border:0;background:transparent;color:var(--muted);font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px}.mobilebar button.active{color:var(--teal)}.mobilebar i{font-style:normal;font-size:17px}.pagehead{align-items:flex-start;flex-direction:column}.pagehead h2{font-size:23px}.pagehead>.btn{align-self:stretch}.head{align-items:flex-start}.headright{flex-direction:column;align-items:flex-end}.select{max-width:125px;font-size:11px;padding:8px}.brand h1{font-size:15px}.mark{width:37px;height:37px}.metric{font-size:22px}}
@media(max-width:430px){.formgrid{grid-template-columns:1fr}.span3{grid-column:1}.checks{grid-template-columns:1fr 1fr}.card{padding:13px}}
</style></head><body><div class="shell">
<header class="head"><div class="brand"><div class="mark">T</div><div><h1>TVault <span style="color:var(--teal)">27</span></h1><small>Trade intelligence journal</small></div></div><div class="headright"><select id="profile" class="select"><option value="you">My journal</option><option value="partner">Partner journal</option></select><button class="btn ghost sm" id="exportTop">⇩ Backup</button></div></header>
<nav class="nav" id="nav"><button class="active" data-page="home"><span>▦</span> Overview</button><button data-page="journal">◷ Journal</button><button data-page="add">＋ New trade</button><button data-page="stats">▥ Analytics</button><button data-page="review">✎ Reviews</button><button data-page="settings">⚙ Settings</button></nav>
<main id="main"></main><div class="foot">TVAULT 27 · PRIVATE LOCAL JOURNAL · NOT CONNECTED TO YOUR BROKER</div></div>
<nav class="mobilebar"><button class="active" data-page="home"><i>▦</i>Home</button><button data-page="journal"><i>◷</i>Journal</button><button data-page="add"><i>＋</i>Log</button><button data-page="stats"><i>▥</i>Stats</button><button data-page="review"><i>✎</i>Review</button></nav>
<div class="modal" id="modal"><div class="modalbox"><div class="cardtitle"><span id="modalTitle">Trade details</span><button class="btn ghost sm" id="close">Close</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='tvault27_data_v1', PROFILE='tvault27_profile_v1';let page='home',profile=localStorage.getItem(PROFILE)||'you',editId=null,photos=[];
const $=s=>document.querySelector(s),all=()=>JSON.parse(localStorage.getItem(KEY)||'{"trades":[],"reviews":[]}'),save=d=>localStorage.setItem(KEY,JSON.stringify(d)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cash=n=>(Number(n)<0?'−':'')+'$'+Math.abs(Number(n||0)).toFixed(2),datefmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'—';
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function mine(){return all().trades.filter(t=>t.profile===profile).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function stat(ts){let c=ts.filter(t=>t.outcome!=='OPEN'),w=c.filter(t=>t.outcome==='WIN'),l=c.filter(t=>t.outcome==='LOSS'),p=c.reduce((a,t)=>a+Number(t.pnl||0),0),gw=w.reduce((a,t)=>a+Math.max(0,+t.pnl),0),gl=Math.abs(l.reduce((a,t)=>a+Math.min(0,+t.pnl),0)),rs=c.map(t=>Number(t.r||0));return{total:ts.length,closed:c.length,w:w.length,l:l.length,p,wr:c.length?w.length/c.length*100:0,avg:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0,pf:gl?gw/gl:gw?Infinity:0,best:c.length?Math.max(...c.map(t=>+t.pnl)):0,worst:c.length?Math.min(...c.map(t=>+t.pnl)):0}}
function rr(e,s,t,side){e=+e;s=+s;t=+t;let risk=Math.abs(e-s),reward=side==='BUY'?t-e:e-t;return e&&risk>0?reward/risk:null}
function metric(label,value,sub,cls=''){return '<div class="card"><div class="metriclabel">'+label+'</div><div class="metric '+cls+'">'+value+'</div><div class="sub">'+sub+'</div></div>'}
function empty(title,desc,button=''){return '<div class="empty"><b>'+title+'</b>'+desc+(button||'')+'</div>'}
function table(ts){return '<div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Market</th><th>Side</th><th>Model</th><th>RR</th><th>Result</th><th>P&L</th><th></th></tr></thead><tbody>'+ts.map(t=>'<tr><td>'+datefmt(t.date)+'</td><td><b>'+esc(t.symbol)+'</b></td><td>'+t.side+'</td><td>'+esc(t.setup)+'</td><td>'+(t.rr?Number(t.rr).toFixed(2)+'R':'—')+'</td><td><span class="badge '+(t.outcome==='WIN'?'win':t.outcome==='LOSS'?'loss':'be')+'">'+t.outcome+'</span></td><td class="'+(+t.pnl>0?'green':+t.pnl<0?'red':'')+'">'+(t.outcome==='OPEN'?'—':cash(t.pnl))+'</td><td><button class="btn ghost sm" data-open="'+t.id+'">View</button></td></tr>').join('')+'</tbody></table></div>'}
function head(k,title,desc,action=''){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>'+action+'</div>'}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function render(){let m=$('#main');if(page==='home')m.innerHTML=home();if(page==='journal')m.innerHTML=journal();if(page==='add')m.innerHTML=form();if(page==='stats')m.innerHTML=analytics();if(page==='review')m.innerHTML=reviews();if(page==='settings')m.innerHTML=settings();bind()}
function home(){let ts=mine(),s=stat(ts),month=new Date().toISOString().slice(0,7),mt=stat(ts.filter(t=>(t.date||'').startsWith(month)));return head('Performance workspace · '+(profile==='you'?'My account':'Partner account'),'Your trading, in focus.','A clear view of process, risk and performance.','<button class="btn primary" data-go="add">＋ Record trade</button>')+'<div class="grid metrics">'+metric('Net realised P&L',cash(s.p),'Closed trades',s.p>0?'green':s.p<0?'red':'')+metric('Win rate',s.wr.toFixed(1)+'%',s.w+' wins · '+s.l+' losses')+metric('Trades recorded',s.total,s.closed+' closed · '+(s.total-s.closed)+' open')+metric('Average realised R',s.avg.toFixed(2)+'R','Per closed trade',s.avg>0?'green':s.avg<0?'red':'')+'</div><div class="grid two"><section class="card"><div class="cardtitle">Equity curve <small>Realised P&L · cumulative</small></div>'+(s.closed?'<canvas id="curve" class="chart"></canvas>':empty('Your equity curve starts here','Log and close your first trade to see your progression.'))+'</section><section class="card"><div class="cardtitle">This month <small>'+month+'</small></div><div class="grid" style="grid-template-columns:1fr 1fr">'+metric('Monthly P&L',cash(mt.p),'Realised only',mt.p>0?'green':mt.p<0?'red':'')+metric('Monthly trades',mt.total,mt.w+' wins · '+mt.l+' losses')+'</div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="metriclabel">Profit factor</div><div class="metric">'+(s.pf===Infinity?'∞':s.pf.toFixed(2))+'</div><div class="sub">Gross winning P&L ÷ gross losing P&L</div></section></div><section class="card" style="margin-top:13px"><div class="cardtitle">Latest executions <button class="btn ghost sm" data-go="journal">Full journal →</button></div>'+(ts.length?table(ts.slice(0,5)):empty('No trades logged yet','Your journal is ready. Record your next setup before the details fade.','<button class="btn primary" data-go="add" style="margin-top:12px">Create first record</button>'))+'</section>'}
function journal(){let ts=mine();return head('Execution archive','Trade journal','Every setup, entry, exit and lesson in one place.','<button class="btn primary" data-go="add">＋ New trade</button>')+'<div class="filters"><input id="q" placeholder="Search market or setup"><select id="out"><option value="">All outcomes</option><option>WIN</option><option>LOSS</option><option>BREAKEVEN</option><option>OPEN</option></select><select id="side"><option value="">All sides</option><option>BUY</option><option>SELL</option></select></div><div id="rows">'+(ts.length?table(ts):empty('No executions yet','Your trade records will appear here.'))+'</div>'}
function form(){let t=window.editing||{};return head(editId?'Update record':'New execution','Document the trade.','Capture your reasoning, risk and execution quality.')+'<form id="tradeForm" class="card"><div class="section">01 / Market context</div><div class="formgrid"><div class="field"><label>Trade date</label><input name="date" type="date" value="'+esc(t.date||new Date().toISOString().slice(0,10))+'" required></div><div class="field"><label>Instrument</label><input name="symbol" placeholder="BTCUSD / EURUSD / XAUUSD" value="'+esc(t.symbol||'')+'" required></div><div class="field"><label>Asset class</label><select name="asset"><option>Forex</option><option '+(t.asset==='Crypto'?'selected':'')+'>Crypto</option><option '+(t.asset==='Commodities'?'selected':'')+'>Commodities</option><option>Indices</option></select></div><div class="field"><label>Direction</label><select name="side"><option '+(t.side!=='SELL'?'selected':'')+'>BUY</option><option '+(t.side==='SELL'?'selected':'')+'>SELL</option></select></div><div class="field"><label>Session</label><select name="session"><option>London</option><option>New York</option><option>Asia</option><option>Overlap</option></select></div><div class="field"><label>Timeframes</label><input name="tf" placeholder="4H bias / 15M entry" value="'+esc(t.tf||'')+'"></div><div class="field"><label>Setup model</label><select name="setup">'+['QMR','Supply & Demand','QMR + Supply/Demand','FVG','Breakout','Other'].map(x=>'<option '+(t.setup===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Entry trigger</label><select name="trigger"><option>Confirmed MSS</option><option>Aggressive</option><option>Retest</option><option>Limit order</option></select></div><div class="field"><label>Outcome</label><select name="outcome">'+['OPEN','WIN','LOSS','BREAKEVEN'].map(x=>'<option '+((t.outcome||'OPEN')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="section">02 / Position & risk</div><div class="formgrid"><div class="field"><label>Entry price</label><input name="entry" type="number" step="any" value="'+esc(t.entry||'')+'"></div><div class="field"><label>Stop loss</label><input name="sl" type="number" step="any" value="'+esc(t.sl||'')+'"></div><div class="field"><label>Take profit</label><input name="tp" type="number" step="any" value="'+esc(t.tp||'')+'"></div><div class="field"><label>Planned risk ($)</label><input name="risk" type="number" step=".01" value="'+esc(t.risk||'15')+'"></div><div class="field"><label>Realised P&L ($)</label><input name="pnl" type="number" step=".01" value="'+esc(t.pnl??'')+'"></div><div class="field"><label>Actual R (optional)</label><input name="actualR" type="number" step=".01" value="'+esc(t.r??'')+'"></div><div class="field span3"><div class="sub" id="rrlive">Enter entry, stop and target to calculate planned RR.</div></div></div><div class="section">03 / Strategy checklist</div><div class="checks">'+['HTF bias clear','QMR identified','Liquidity mapped','Liquidity swept','POI identified','MSS confirmed','Displacement present','POR / target defined','Risk within limit'].map(x=>'<label><input type="checkbox" name="checks" value="'+x+'" '+((t.checks||[]).includes(x)?'checked':'')+'>'+x+'</label>').join('')+'</div><div class="section">04 / Execution review</div><div class="formgrid"><div class="field span3"><label>Trade thesis</label><textarea name="thesis" placeholder="Why this trade? HTF narrative, liquidity event, POI and confirmation...">'+esc(t.thesis||'')+'</textarea></div><div class="field span3"><label>Lesson / mistake</label><textarea name="lesson" placeholder="What did you execute well? What needs to change?">'+esc(t.lesson||'')+'</textarea></div><div class="field"><label>Execution score / 10</label><input name="execution" type="number" min="1" max="10" value="'+esc(t.execution||'')+'"></div><div class="field"><label>Discipline score / 10</label><input name="discipline" type="number" min="1" max="10" value="'+esc(t.discipline||'')+'"></div><div class="field"><label>Emotional state</label><select name="emotion"><option>Calm</option><option>Confident</option><option>FOMO</option><option>Frustrated</option><option>Hesitant</option><option>Revenge trading</option></select></div><div class="field span3"><label>Chart screenshots</label><input id="photos" type="file" accept="image/*" multiple><div class="sub">Images are resized and stored on this phone with the trade.</div><div id="preview"></div></div></div><div class="actions"><button type="button" class="btn ghost" data-go="journal">Cancel</button><button class="btn primary" type="submit">Save execution</button></div></form>'}
function analytics(){let ts=mine(),s=stat(ts),closed=ts.filter(t=>t.outcome!=='OPEN'),groups={};closed.forEach(t=>groups[t.setup]=(groups[t.setup]||0)+1);let max=Math.max(1,...Object.values(groups));return head('Performance intelligence','Know your edge.','Review which models and behaviours contribute to your results.')+'<div class="grid metrics">'+metric('Profit factor',s.pf===Infinity?'∞':s.pf.toFixed(2),'Gross profit / gross loss')+metric('Average R',s.avg.toFixed(2)+'R','Average actual R')+metric('Best trade',cash(s.best),'Highest realised result','green')+metric('Worst trade',cash(s.worst),'Lowest realised result','red')+'</div><div class="grid two"><section class="card"><div class="cardtitle">Setup distribution</div>'+(Object.keys(groups).length?'<div class="bars">'+Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="bar"><span>'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+(v/max*100)+'%"></div></div><b>'+v+'</b></div>').join('')+'</div>':empty('Waiting for data','Log closed trades to compare strategy models.'))+'</section><section class="card"><div class="cardtitle">Outcome breakdown</div><div class="bars">'+[['Wins',s.w],['Losses',s.l],['Breakeven',closed.filter(t=>t.outcome==='BREAKEVEN').length],['Open',ts.filter(t=>t.outcome==='OPEN').length]].map(([k,v])=>'<div class="bar"><span>'+k+'</span><div class="track"><div class="fill" style="width:'+(ts.length?v/ts.length*100:0)+'%"></div></div><b>'+v+'</b></div>').join('')+'</div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="metriclabel">Recorded expectancy</div><div class="metric">'+s.avg.toFixed(2)+'R</div><div class="sub">Average actual R across closed trades.</div></section></div>'}
function reviews(){let rs=all().reviews.filter(r=>r.profile===profile).sort((a,b)=>b.date.localeCompare(a.date));return head('Continuous improvement','Weekly reviews','Make one measurable adjustment at a time.','<button class="btn primary" id="newReview">＋ Add review</button>')+'<section class="card"><div class="cardtitle">Review history <small>'+rs.length+' saved</small></div>'+(rs.length?rs.map(r=>'<div class="note"><div style="display:flex;justify-content:space-between"><h4>'+esc(r.title)+'</h4><span class="sub">'+datefmt(r.date)+'</span></div><p>'+esc(r.body)+'</p></div>').join(''):empty('No reviews saved','Create a weekly review after your final trading session.'))+'</section>'}
function settings(){return head('Control centre','Your data. Your control.','Local storage, backups and profile settings.')+'<div class="grid two"><section class="card"><div class="cardtitle">Trader identity</div><div class="field"><label>My display name</label><input id="nameYou" value="'+esc(localStorage.getItem('tv_name_you')||'Trader 1')+'"></div><div class="field" style="margin-top:12px"><label>Partner display name</label><input id="namePartner" value="'+esc(localStorage.getItem('tv_name_partner')||'Trader 2')+'"></div><button class="btn primary" id="saveNames" style="margin-top:14px">Save names</button></section><section class="card"><div class="cardtitle">Backup & restore</div><p class="muted">Export a full JSON backup regularly. Keep a copy somewhere safe before changing phones or reinstalling the app.</p><button class="btn primary" id="backup">⇩ Export full backup</button><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="field"><label>Restore from backup</label><input type="file" id="restore" accept=".json,application/json"></div><p class="sub">Import merges records by unique trade ID.</p></section></div><section class="card" style="margin-top:13px"><div class="cardtitle">Important privacy & data notes</div><p class="muted">This version stores records locally on this phone. It does not have cloud sync, password protection or automatic sharing between devices. Export backups regularly. Uninstalling the app or clearing its storage can erase journal records.</p><p class="muted">The app is a journal and analytics tool. It does not connect to MT5, place trades or provide investment advice.</p></section>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTrade(b.dataset.open));let f=$('#tradeForm');if(f){let update=()=>{let d=new FormData(f),v=rr(d.get('entry'),d.get('sl'),d.get('tp'),d.get('side'));$('#rrlive').textContent=v===null?'Enter valid entry, stop and target prices to calculate planned RR.':'Planned reward-to-risk: '+v.toFixed(2)+'R'};['entry','sl','tp','side'].forEach(n=>f.elements[n].addEventListener('input',update));update();$('#photos').onchange=async e=>{photos=[];for(let file of [...e.target.files].slice(0,4))photos.push(await imageData(file));$('#preview').textContent=photos.length+' screenshot(s) ready';};f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),o=Object.fromEntries(d.entries()),db=all();o.id=editId||crypto.randomUUID();o.profile=profile;o.checks=d.getAll('checks');o.rr=rr(o.entry,o.sl,o.tp,o.side);o.risk=+o.risk||0;o.pnl=+o.pnl||0;o.r=o.actualR!==''?+o.actualR:(o.risk?o.pnl/o.risk:0);o.photos=photos.length?photos:(window.editing?.photos||[]);let ix=db.trades.findIndex(x=>x.id===o.id);if(ix<0)db.trades.push(o);else db.trades[ix]=o;save(db);editId=null;window.editing=null;photos=[];toast('Trade saved securely on this phone');go('journal')}}
if($('#q')){let filter=()=>{let q=$('#q').value.toLowerCase(),out=$('#out').value,side=$('#side').value,ts=mine().filter(t=>(!q||(t.symbol+' '+t.setup).toLowerCase().includes(q))&&(!out||t.outcome===out)&&(!side||t.side===side));$('#rows').innerHTML=ts.length?table(ts):empty('No matches','Adjust the filters and try again.');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTrade(b.dataset.open))};$('#q').oninput=filter;$('#out').onchange=filter;$('#side').onchange=filter}
if($('#curve'))drawCurve($('#curve'));if($('#newReview'))$('#newReview').onclick=()=>{let title=prompt('Review title (e.g. Week 1 review)');if(!title)return;let body=prompt('What worked, what did not, and one action for next week?');if(body===null)return;let d=all();d.reviews.push({id:crypto.randomUUID(),profile,title,body,date:new Date().toISOString().slice(0,10)});save(d);toast('Review saved');render()};
if($('#saveNames'))$('#saveNames').onclick=()=>{localStorage.setItem('tv_name_you',$('#nameYou').value);localStorage.setItem('tv_name_partner',$('#namePartner').value);toast('Names saved')};if($('#backup'))$('#backup').onclick=backup;if($('#restore'))$('#restore').onchange=restore}
function imageData(file){return new Promise(resolve=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),sc=Math.min(1100/img.width,1100/img.height,1);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.7))};img.src=u})}
function openTrade(id){let t=all().trades.find(x=>x.id===id);if(!t)return;$('#modalTitle').textContent=t.symbol+' · '+t.side+' · '+datefmt(t.date);$('#modalBody').innerHTML='<div class="grid metrics" style="grid-template-columns:repeat(3,1fr)">'+metric('Outcome',t.outcome,'Status')+metric('Realised P&L',cash(t.pnl),'Closed result',t.pnl>0?'green':t.pnl<0?'red':'')+metric('Planned RR',t.rr?Number(t.rr).toFixed(2)+'R':'—','At entry')+'</div><div class="note"><b>Trade thesis</b><p>'+esc(t.thesis||'—')+'</p><br><b>Checklist</b><p>'+esc((t.checks||[]).join(' · ')||'Not recorded')+'</p><br><b>Lesson</b><p>'+esc(t.lesson||'—')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+(t.photos||[]).map(x=>'<img src="'+x+'" style="width:110px;border-radius:9px">').join('')+'</div><div class="actions"><button class="btn ghost" id="edit">Edit</button><button class="btn" style="background:#4a2030;color:#ffc1cb" id="del">Delete</button></div></div>';$('#modal').classList.add('show');$('#edit').onclick=()=>{editId=t.id;window.editing=t;photos=[];$('#modal').classList.remove('show');go('add')};$('#del').onclick=()=>{if(confirm('Permanently delete this trade from this phone?')){let d=all();d.trades=d.trades.filter(x=>x.id!==id);save(d);$('#modal').classList.remove('show');render();toast('Trade deleted')}}}
function drawCurve(c){let ts=mine().filter(t=>t.outcome!=='OPEN').sort((a,b)=>a.date.localeCompare(b.date)),v=[0];ts.forEach(t=>v.push(v[v.length-1]+ +t.pnl));let ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);let min=Math.min(0,...v),max=Math.max(0,...v),range=max-min||1,p=20;ctx.strokeStyle='#2a4057';for(let i=0;i<4;i++){let y=p+(h-p*2)*i/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}let pts=v.map((x,i)=>({x:p+(w-p*2)*i/Math.max(1,v.length-1),y:h-p-(x-min)/range*(h-p*2)}));ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.strokeStyle=v.at(-1)>=0?'#45d6b0':'#ff7187';ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle='#93a9bf';ctx.font='10px system-ui';ctx.fillText(cash(max),p,12);ctx.fillText(cash(min),p,h-4)}
function backup(){let blob=new Blob([JSON.stringify({app:'TVault27',version:1,exportedAt:new Date().toISOString(),data:all()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='tvault27-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);toast('Backup exported')}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.app!=='TVault27')throw Error('Not a TVault backup');let d=all();for(let t of x.data.trades||[])if(!d.trades.some(z=>z.id===t.id))d.trades.push(t);for(let q of x.data.reviews||[])if(!d.reviews.some(z=>z.id===q.id))d.reviews.push(q);save(d);toast('Backup restored');render()}catch(err){alert('Restore failed: '+err.message)}};r.readAsText(file)}
$('#profile').value=profile;$('#profile').onchange=e=>{profile=e.target.value;localStorage.setItem(PROFILE,profile);render()};$('#exportTop').onclick=backup;$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script></body></html>
